[package]
name = "privchat"
version = "0.1.0"
edition = "2024"
authors = ["linuxmobile"]
description = "Privchat terminal client (TUI)"
license = "MIT"
repository = "https://github.com/privchat/privchat-cli"
keywords = ["privchat", "tui", "terminal", "client"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }

ratatui = { version = "0.30.2", features = ["crossterm_0_29"], default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
tui-textarea = { package = "ratatui-textarea", version = "0.9.3", default-features = false, features = ["crossterm", "search"] }
tempfile = "3.27.0"

reqwest = { version = "0.13.5", features = ["json", "rustls", "multipart", "gzip"], default-features = false }
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
chrono = { version = "0.4.45", features = ["serde", "clock"], default-features = false }
flate2 = "1.1.10"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

thiserror = "2.0.21"
color-eyre = "0.6.5"

toml = "1.1.8"
directories = "6.0"

keyring = { version = "4.2.0" }
zeroize = { version = "1.9.1", features = ["derive"] }

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi", "std", "registry"] }

async-trait = "0.1.92"

dotenvy = "0.15.7"

clap = { version = "4.6.7", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tachyonfx = "0.25.2"
lru = "0.19.0"
unicode-width = "0.2.3"

# Image rendering - Common
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.11.1"
hex = "0.4.3"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
bitflags = { version = "2.13.2", features = ["serde"] }
tui-scrollbar = "0.2.8"
uuid = { version = "1.29.0", features = ["v4", "fast-rng"] }
parking_lot = "0.13.0"
arboard = { version = "3.7.0", features = ["wayland-data-control", "image-data"], default-features = false }
notify-rust = "4.18.2"

# Privchat SDK（协议层替换）
privchat-sdk-ffi = { version = "1.0.0-beta.1", path = "../privchat-sdk/crates/privchat-sdk-ffi" }

# Image rendering - Platform Specific

[target.'cfg(target_os = "linux")'.dependencies]
ratatui-image = { version = "11.1.0", features = ["crossterm", "chafa-dyn"], default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
ratatui-image = { version = "11.1.0", features = ["crossterm"], default-features = false }

[target.'cfg(windows)'.dependencies]
ratatui-image = { version = "11.1.0", features = ["crossterm"], default-features = false }

[dev-dependencies]
tokio-test = "0.4.6"
mockall = "0.15.0"

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
